<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Arcade</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101522;
            color: white;
            text-align: center;
        }

        header {
            padding: 50px 20px 30px;
        }

        h1 {
            font-size: 50px;
            margin: 0;
        }

        header p {
            color: #bbb;
            font-size: 18px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(230px, 1fr)
            );

            gap: 25px;

            max-width: 1100px;

            margin: auto;

            padding: 30px;
        }

        .game {
            background: #1d2638;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 60px;
        }

        h2 {
            margin: 15px 0 10px;
        }

        .game p {
            color: #aaa;
            min-height: 40px;
        }

        .play {
            display: inline-block;

            margin-top: 15px;

            padding: 12px 30px;

            background: #ffb52e;

            color: black;

            text-decoration: none;

            font-weight: bold;

            border-radius: 10px;
        }

        .play:hover {
            background: #ffd166;
        }

        footer {
            padding: 30px;

            color: #777;
        }
    </style>
</head>

<body>

<header>

    <h1>🎮 My Game Arcade</h1>

    <p>Choose a game and start playing!</p>

</header>


<div class="games">

    <div class="game">
        <div class="icon">🚗</div>
        <h2>Game 1</h2>
        <p>Drive around and explore.</p>

        <a class="play" href="games/game1.html"
            PLAY
        </a>
    </div>


    <div class="game">
        <div class="icon">🏎️</div>
        <h2>Game 2</h2>
        <p>Race your way to victory.</p>

        <a class="play" href="games/game2.html"
            PLAY
        </a>
    </div>


    <div class="game">
        <div class="icon">🌆</div>
        <h2>Game 3</h2>
        <p>Explore the city.</p>

        <a class="play" href="games/game3.html"
            PLAY
        </a>
    </div>


    <div class="game">
        <div class="icon">🎯</div>
        <h2>Game 4</h2>
        <p>Enter the action.</p>

        <a class="play" href="games/game4.html"
            PLAY
        </a>
    </div>


    <div class="game">
        <div class="icon">👥</div>
        <h2>Game 5</h2>
        <p>Play a 2-player game.</p>

        <a class="play" href="games/game5.html"
            PLAY
        </a>
    </div>


    <div class="game">
        <div class="icon">🧱</div>
        <h2>Game 6</h2>
        <p>Play the 3D Jenga challenge.</p>

        <a class="play" href="games/game6.html"
            PLAY
        </a>
    </div>

</div>


<footer>
    My Game Arcade © 2026
</footer>

</body>
</html>
