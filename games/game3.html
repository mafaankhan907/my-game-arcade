<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Highway Racer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #87ceeb;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        #message {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            color: white;
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 5px black;
            display: none;
        }

        #startButton {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            padding: 14px 30px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="ui">
        🏁 Score: <span id="score">0</span><br>
        ⚡ Speed: <span id="speed">1</span>
    </div>

    <div id="message">
        💥 GAME OVER
        <br>
        <span style="font-size:22px;">
            Click Restart to play again
        </span>
    </div>

    <div id="controls">
        ⬅️ A / Left Arrow &nbsp;&nbsp;
        D / Right Arrow ➡️
    </div>

    <button id="startButton">START RACE</button>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>

        // ==========================
        // SCENE
        // ==========================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87ceeb);

        scene.fog = new THREE.Fog(
            0x87ceeb,
            30,
            180
        );


        // ==========================
        // CAMERA
        // ==========================

        const camera =
            new THREE.PerspectiveCamera(
                65,
                window.innerWidth /
                window.innerHeight,
                0.1,
                500
            );

        camera.position.set(
            0,
            6,
            12
        );


        // ==========================
        // RENDERER
        // ==========================

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

        document.body.appendChild(
            renderer.domElement
        );


        // ==========================
        // LIGHT
        // ==========================

        const ambient =
            new THREE.AmbientLight(
                0xffffff,
                1.5
            );

        scene.add(ambient);


        const sun =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );

        sun.position.set(
            10,
            20,
            10
        );

        scene.add(sun);


        // ==========================
        // ROAD
        // ==========================

        const roadGeometry =
            new THREE.PlaneGeometry(
                14,
                400
            );

        const roadMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x333333
            });

        const road =
            new THREE.Mesh(
                roadGeometry,
                roadMaterial
            );

        road.rotation.x =
            -Math.PI / 2;

        road.position.z = -180;

        scene.add(road);


        // ==========================
        // GRASS
        // ==========================

        const grassGeometry =
            new THREE.PlaneGeometry(
                100,
                400
            );

        const grassMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x278027
            });

        const grass =
            new THREE.Mesh(
                grassGeometry,
                grassMaterial
            );

        grass.rotation.x =
            -Math.PI / 2;

        grass.position.y = -0.03;

        grass.position.z = -180;

        scene.add(grass);


        // ==========================
        // ROAD LINES
        // ==========================

        const roadLines = [];

        function makeLine(x, z) {

            const geometry =
                new THREE.BoxGeometry(
                    0.12,
                    0.04,
                    6
                );

            const material =
                new THREE.MeshBasicMaterial({
                    color: 0xffffff
                });

            const line =
                new THREE.Mesh(
                    geometry,
                    material
                );

            line.position.set(
                x,
                0.04,
                z
            );

            scene.add(line);

            roadLines.push(line);
        }


        for (
            let z = 20;
            z > -400;
            z -= 12
        ) {

            makeLine(-2.33, z);
            makeLine(2.33, z);

        }


        // ==========================
        // CAR CREATOR
        // ==========================

        function makeCar(color) {

            const car =
                new THREE.Group();


            // Body

            const bodyGeometry =
                new THREE.BoxGeometry(
                    1.5,
                    0.55,
                    2.8
                );

            const bodyMaterial =
                new THREE.MeshStandardMaterial({
                    color: color
                });

            const body =
                new THREE.Mesh(
                    bodyGeometry,
                    bodyMaterial
                );

            body.position.y = 0.55;

            car.add(body);


            // Windows

            const windowGeometry =
                new THREE.BoxGeometry(
                    1.05,
                    0.5,
                    1.2
                );

            const windowMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x111111
                });

            const windows =
                new THREE.Mesh(
                    windowGeometry,
                    windowMaterial
                );

            windows.position.y = 0.95;

            windows.position.z = -0.2;

            car.add(windows);


            // Wheels

            function wheel(x, z) {

                const geometry =
                    new THREE.CylinderGeometry(
                        0.32,
                        0.32,
                        0.25,
                        16
                    );

                const material =
                    new THREE.MeshStandardMaterial({
                        color: 0x111111
                    });

                const w =
                    new THREE.Mesh(
                        geometry,
                        material
                    );

                w.rotation.z =
                    Math.PI / 2;

                w.position.set(
                    x,
                    0.35,
                    z
                );

                car.add(w);
            }


            wheel(-0.82, 0.9);
            wheel(0.82, 0.9);
            wheel(-0.82, -0.9);
            wheel(0.82, -0.9);


            return car;
        }


        // ==========================
        // PLAYER
        // ==========================

        const player =
            makeCar(0x0066ff);

        player.position.set(
            0,
            0,
            7
        );

        scene.add(player);


        // ==========================
        // TRAFFIC
        // ==========================

        const traffic = [];

        const lanes = [
            -4.6,
            -2.3,
            0,
            2.3,
            4.6
        ];


        function spawnTraffic() {

            const colors = [
                0xff2222,
                0xffff00,
                0xff8800,
                0x00cc66,
                0xaa22ff,
                0xffffff
            ];

            const color =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];

            const car =
                makeCar(color);

            car.position.x =
                lanes[
                    Math.floor(
                        Math.random() *
                        lanes.length
                    )
                ];

            car.position.z =
                -100;

            scene.add(car);

            traffic.push(car);
        }


        // ==========================
        // TREES
        // ==========================

        const trees = [];


        function spawnTree(x, z) {

            const tree =
                new THREE.Group();


            const trunk =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.2,
                        0.25,
                        1.5,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x754321
                    })
                );

            trunk.position.y =
                0.75;

            tree.add(trunk);


            const leaves =
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        1.1,
                        10,
                        10
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x0b7a20
                    })
                );

            leaves.position.y =
                2;

            tree.add(leaves);


            tree.position.set(
                x,
                0,
                z
            );

            scene.add(tree);

            trees.push(tree);
        }


        for (
            let z = 10;
            z > -400;
            z -= 18
        ) {

            spawnTree(
                -12,
                z
            );

            spawnTree(
                12,
                z - 9
            );

        }


        // ==========================
        // GAME VARIABLES
        // ==========================

        let running = false;

        let score = 0;

        let speed = 0.45;

        let spawnTimer = 0;

        let playerTargetX = 0;


        const scoreText =
            document.getElementById(
                "score"
            );

        const speedText =
            document.getElementById(
                "speed"
            );

        const message =
            document.getElementById(
                "message"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );


        // ==========================
        // CONTROLS
        // ==========================

        document.addEventListener(
            "keydown",
            function(event) {

                if (!running) return;


                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    playerTargetX -= 2.3;

                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    playerTargetX += 2.3;

                }


                playerTargetX =
                    Math.max(
                        -4.6,
                        Math.min(
                            4.6,
                            playerTargetX
                        )
                    );

            }
        );


        // ==========================
        // COLLISION
        // ==========================

        function collision(car) {

            const xDistance =
                Math.abs(
                    player.position.x -
                    car.position.x
                );

            const zDistance =
                Math.abs(
                    player.position.z -
                    car.position.z
                );


            return (
                xDistance < 1.3 &&
                zDistance < 2.2
            );
        }


        // ==========================
        // START GAME
        // ==========================

        function startGame() {

            // Remove old traffic

            for (
                let i = traffic.length - 1;
                i >= 0;
                i--
            ) {

                scene.remove(
                    traffic[i]
                );

            }

            traffic.length = 0;


            score = 0;

            speed = 0.45;

            spawnTimer = 0;

            player.position.x = 0;

            playerTargetX = 0;


            scoreText.textContent =
                "0";

            speedText.textContent =
                "1";


            message.style.display =
                "none";


            running = true;

            startButton.textContent =
                "RESTART";


            // Initial traffic

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                spawnTraffic();

                traffic[
                    traffic.length - 1
                ].position.z =
                    -30 -
                    i * 45;

            }

        }


        startButton.onclick =
            startGame;


        // ==========================
        // GAME OVER
        // ==========================

        function gameOver() {

            running = false;

            message.style.display =
                "block";

        }


        // ==========================
        // GAME LOOP
        // ==========================

        function animate() {

            requestAnimationFrame(
                animate
            );


            if (running) {


                // Player steering

                player.position.x +=
                    (
                        playerTargetX -
                        player.position.x
                    ) * 0.12;


                // Traffic movement

                for (
                    let i = traffic.length - 1;
                    i >= 0;
                    i--
                ) {

                    const car =
                        traffic[i];

                    car.position.z +=
                        speed;


                    if (
                        collision(car)
                    ) {

                        gameOver();

                    }


                    if (
                        car.position.z > 25
                    ) {

                        scene.remove(car);

                        traffic.splice(
                            i,
                            1
                        );

                        score++;

                        scoreText.textContent =
                            score;


                        if (
                            score % 10 === 0
                        ) {

                            speed += 0.1;

                        }

                    }

                }


                // Spawn traffic

                spawnTimer += 0.016;

                if (
                    spawnTimer >= 1.0
                ) {

                    spawnTraffic();

                    spawnTimer = 0;

                }


                // Road lines

                for (
                    const line of roadLines
                ) {

                    line.position.z +=
                        speed;

                    if (
                        line.position.z > 25
                    ) {

                        line.position.z -=
                            420;

                    }

                }


                // Trees

                for (
                    const tree of trees
                ) {

                    tree.position.z +=
                        speed;

                    if (
                        tree.position.z > 25
                    ) {

                        tree.position.z -=
                            420;

                    }

                }


                speedText.textContent =
                    Math.floor(
                        speed * 20
                    );

            }


            // Camera

            camera.position.x +=
                (
                    player.position.x *
                    0.3 -
                    camera.position.x
                ) * 0.08;


            camera.lookAt(
                player.position.x,
                1,
                -20
            );


            renderer.render(
                scene,
                camera
            );

        }


        // ==========================
        // RESIZE
        // ==========================

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // Start 3D rendering

        animate();

    </script>

</body>
</html>
